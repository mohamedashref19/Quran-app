<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | تطبيق اقرأ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <img src="/img/title.png" alt="Logo" width="50">
            <h3 class="mt-2">حساب جديد</h3>
        </div>
        
       <form id="signupFormPage"> <div class="mb-3">
        <label class="form-label">الاسم</label>
        <input type="text" id="signup-name" class="form-control" required> </div>
    <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" id="signup-email" class="form-control" required> </div>
    <div class="mb-3">
        <label class="form-label">كلمة المرور</label>
        <input type="password" id="signup-password" class="form-control" required> </div>
    <div class="mb-3">
        <label class="form-label">تأكيد كلمة المرور</label>
        <input type="password" id="signup-passwordConfirm" class="form-control" required> </div>
    <button type="submit" class="btn btn-success w-100">تسجيل</button>
</form>
        
        <div class="text-center mt-3">
            <a href="/login.html" class="text-decoration-none">لديك حساب بالفعل؟</a>
             <br>
            <a href="/index.html" class="text-muted small">العودة للرئيسية</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="/js/bundle.js"></script>
</body>
</html>
