<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqra | تطبيق اقرأ</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" type="image/png" href="/img/title.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icons/icon-192.png">
    
    <meta name="theme-color" content="#1e5f31">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-aqra shadow-sm py-2">
        <div class="container d-flex align-items-center">
            <a class="navbar-brand fw-bold order-0" href="/">📖 تطبيق اقرأ</a>
            
            <div class="d-flex align-items-center mx-auto order-1" style="flex: 1; max-width: 600px; justify-content: center;">
                 <div class="search-container position-relative w-100" style="max-width: 450px;">
                    <input id="search-input" class="form-control rounded-pill px-4 py-2 test2" type="text" placeholder="ابحث عن آية أو كلمة..." style="border: 2px solid #1e5f31; padding-left: 40px;">
                    <i class="fas fa-search position-absolute text-muted" style="left: 15px; top: 50%; transform: translateY(-50%);"></i>
                    <div id="search-results" class="list-group position-absolute w-100 shadow-lg d-none" style="z-index: 1000; max-height: 300px; overflow-y: auto; top: 50px;"></div>
                 </div>
                 
                 <button id="theme-toggle" class="btn btn-link nav-link ms-2" title="تغيير المظهر">
                    <i class="fas fa-moon fs-5 text-white"></i>
                 </button>
            </div>

            <button class="navbar-toggler order-2 ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="navbarNav" class="collapse navbar-collapse order-3">
                <ul class="navbar-nav ms-auto" id="nav-links">
                    <li class="nav-item"><a class="nav-link" href="/login">تسجيل دخول</a></li>
                    <li class="nav-item"><a class="nav-link" href="/signup">إنشاء حساب</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <div class="row justify-content-center mb-5">
            <div class="col-md-8 text-center">
                <h3 id="location-name" class="text-success fw-bold">جاري تحديد الموقع...</h3>
                <h5 id="hijri-date" class="text-muted mb-4"></h5>
                <div id="prayers-list" class="list-group shadow-sm">
                    </div>
            </div>
        </div>

        <div id="active-khatmah" class="d-none row justify-content-center">
            <div class="col-md-8">
                <div class="card border-success shadow-sm">
                    <div class="card-body text-center">
                        <h4 id="khatmah-name" class="card-title text-success fw-bold"></h4>
                        <p id="daily-target" class="card-text lead my-3"></p>
                        <p id="khatmah-status-text" class="text-muted"></p>
                        
                        <div class="progress mb-3" style="height: 25px;">
                            <div id="progress-bar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        
                        <a href="/quran" class="btn btn-success">اذهب للمصحف <i class="fas fa-book-open ms-1"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <div id="create-khatmah" class="d-none text-center mt-4">
            <div class="alert alert-light border shadow-sm">
                <h5>لا توجد ختمة نشطة حالياً</h5>
                <p>ابدأ رحلتك مع القرآن الكريم ونظم وقتك.</p>
                <a href="/khatmah" class="btn btn-outline-success">بدء ختمة جديدة</a>
            </div>
        </div>

    </div>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container">
            <div class="row align-items-center flex-column-reverse flex-md-row">
                <div class="col-md-6 text-center text-md-end">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-start">
                        <img class="me-2" src="/img/title.png" alt="Aqra Logo" style="width: 18px; height: 18px; opacity: 0.8;">
                        <p class="mb-0 text-muted fw-light" style="font-size: 0.85rem;">
                            جميع الحقوق محفوظة لـ <strong class="text-success">تطبيق اقرأ</strong> &copy; <span id="current-year"></span>
                        </p>
                    </div>
                </div>
                <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2">
                        <p class="mb-0 text-muted" style="font-size: 0.85rem;">تم التطوير بواسطة 
                            <a class="text-dark text-decoration-none fw-bold" href="https://mohamed-ashraf-backend.netlify.app/" target="_blank">Mohamed Ashraf</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>

    <script src="/js/bundle.js"></script> 

</body>
</html>
