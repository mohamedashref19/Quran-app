<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور | تطبيق اقرأ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm p-4 text-center" style="max-width: 400px; width: 100%;">
        <div class="display-1 mb-3">🔐</div>
        <h3>نسيت كلمة المرور؟</h3>
        <p class="text-muted">أدخل بريدك الإلكتروني وسنرسل لك كود التحقق.</p>

        <form id="forgotPasswordForm" class="mt-3">
            <div class="mb-3 text-start">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="forgot-email" class="form-control" placeholder="example@email.com" required>
            </div>
            <div id="forgot-success-msg" class="alert alert-success d-none"></div>
            <button type="submit" id="forgot-password-btn" class="btn btn-success w-100">
                <i class="fas fa-paper-plane me-2"></i> إرسال كود التحقق
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/login.html" class="text-decoration-none small">العودة لتسجيل الدخول</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="/js/bundle.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            await window.forgotPassword(email);
        });
    </script>
</body>
</html>
