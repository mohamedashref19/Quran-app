<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور | تطبيق اقرأ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <h3 class="text-center mb-4 text-success">استعادة الحساب 🔒</h3>
        <p class="text-muted text-center small">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لاستعادة كلمة المرور.</p>
        
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input id="email" class="form-control" type="email" required>
            </div>
            <button type="submit" class="btn btn-success w-100">إرسال الرابط</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login.html" class="text-muted small">عودة لتسجيل الدخول</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/bundle.js"></script>
</body>
</html>
