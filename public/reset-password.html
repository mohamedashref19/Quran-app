<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور | تطبيق اقرأ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm p-4 text-center" style="max-width: 400px; width: 100%;">
        <div class="display-1 mb-3">🔑</div>
        <h3>إعادة تعيين كلمة المرور</h3>
        <p class="text-muted">أدخل الكود المرسل إلى بريدك وكلمة المرور الجديدة.</p>

        <form id="resetPasswordForm" class="mt-3">
            <div class="mb-3 text-start">
                <label class="form-label">كود التحقق</label>
                <input type="text" id="reset-otp" class="form-control text-center fs-4"
                    placeholder="######" maxlength="6" required style="letter-spacing: 5px;">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور الجديدة</label>
                <input type="password" id="reset-password" class="form-control"
                    placeholder="8 أحرف على الأقل" required minlength="8">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">تأكيد كلمة المرور</label>
                <input type="password" id="reset-password-confirm" class="form-control" required minlength="8">
            </div>
            <button type="submit" id="reset-btn" class="btn btn-success w-100">تغيير كلمة المرور</button>
        </form>

        <div class="text-center mt-3">
            <a href="/forgot-password.html" class="text-muted small">لم تستلم الكود؟ أعد الإرسال</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="/js/bundle.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('reset-otp').value;
            const password = document.getElementById('reset-password').value;
            const passwordConfirm = document.getElementById('reset-password-confirm').value;

            if (password !== passwordConfirm) {
                Swal.fire('خطأ', 'كلمة المرور وتأكيدها غير متطابقتين', 'error');
                return;
            }

            const btn = document.getElementById('reset-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> جاري التغيير...';

            await window.resetPassword(otp, password, passwordConfirm);


            btn.disabled = false;
            btn.innerHTML = 'تغيير كلمة المرور';
        });
    </script>
</body>
</html>
