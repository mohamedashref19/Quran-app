<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا يوجد اتصال | تطبيق اقرأ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #2c3e50;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 0;
        }
        .container {
            padding: 20px;
            max-width: 500px;
        }
        .icon {
            font-size: 80px;
            color: #d4af37; /* اللون الذهبي */
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            color: #1e5f31; /* الأخضر الأساسي */
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            background-color: #1e5f31;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 15px rgba(30, 95, 49, 0.2);
        }
        .btn:hover {
            background-color: #144022;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>انقطع الاتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالشبكة حالياً.<br>تأكد من اتصالك بالواي فاي أو بيانات الهاتف ثم حاول مرة أخرى.</p>
        <button class="btn" onclick="window.location.reload()">إعادة المحاولة ↻</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</body>
</html>
