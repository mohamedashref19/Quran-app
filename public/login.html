<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | تطبيق اقرأ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <img src="/img/title.png" alt="Logo" width="50">
            <h3 class="mt-2">تسجيل الدخول</h3>
        </div>
        
      <form id="loginFormPage">
    <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
      <input type="email" id="login-email" class="form-control" autocomplete="username" required>
    </div>
    <div class="mb-3">
    <label class="form-label">كلمة المرور</label>
    <div class="input-group">
        <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('login-password', this)">
            <i class="fas fa-eye"></i>
        </button>
    </div>
</div>
    <div class="text-end mb-2">
        <a href="/forgot-password.html" class="text-muted small">نسيت كلمة المرور؟</a>
    </div>
    <button type="submit" id="loginBtn" class="btn btn-success w-100">دخول</button>
</form>
        <div class="text-center mt-3">
            <a href="/signup.html" class="text-decoration-none">إنشاء حساب جديد</a>
            <br>
            <a href="/index.html" class="text-muted small">العودة للرئيسية</a>
        </div>
    </div>
    <script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash'); // تغيير الأيقونة لعين عليها خط
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye'); // إرجاع الأيقونة للعين العادية
        }
    }
</script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <!-- <script src="/js/bundle.js"></script> -->
     <script src="/dist/index.js" type="module"></script>
</body>
</html>
