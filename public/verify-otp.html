<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب | تطبيق اقرأ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm p-4 text-center" style="max-width: 400px; width: 100%;">
        <div class="display-1 mb-3">📩</div>
        <h3>تفعيل الحساب</h3>
        <p class="text-muted">أدخل الرمز المرسل إلى بريدك الإلكتروني.</p>
        
        <form id="verifyOTPFormPage" class="mt-4"> 
            <div class="mb-3 text-start">
                <label class="form-label">البريد الإلكتروني</label>
                <input id="verify-email" class="form-control" type="email" placeholder="الإيميل المسجل" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">رمز التحقق (OTP)</label>
                <input id="verify-otp" autocomplete="one-time-code" class="form-control text-center fs-4" type="text" placeholder="######" required maxlength="6" style="letter-spacing: 5px;">
            </div>
            <button type="submit" class="btn btn-success w-100">تفعيل</button>
        </form>

        <div class="text-center mt-3">
            <a href="#" id="resend-otp-btn-page" class="text-success text-decoration-none fw-bold small">
                <i class="fas fa-redo me-1"></i> لم تستلم الكود؟ أعد الإرسال
            </a>
            <br><br>
            <a href="/login.html" class="text-muted small">العودة لتسجيل الدخول</a>
        </div>
        </div>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="/dist/index.js" type="module"></script>
</body>
</html>
