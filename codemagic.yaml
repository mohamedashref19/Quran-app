workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mohamedashraf.aqra

      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          fi

      - name: Build iOS IPA
        script: |
          if [ -f "pubspec.yaml" ]; then
            flutter build ipa --release
          else
            xcode-project build-ipa \
              --project "ios/Runner.xcodeproj" \
              --scheme "Runner"
          fi

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
