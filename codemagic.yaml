workflows:
  ios-capacitor-build:
    name: iOS Build (Capacitor)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios
      - name: Build Web App
        script: |
          npm run build:js
      - name: Capacitor Add and Sync
        script: |
          npx cap add ios || echo "iOS platform already added"
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Test iOS Build (Without Code Signing)
        script: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO